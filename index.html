const ICON_SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>';
const ICON_MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
let prefSaveT=null, prefDirty=false;   // 아직 설정 파일에 안 쓴 변경이 있는가
function prefKey(){ return 'redpen.pref.'+(me?me.id:'_'); }
function applyTheme(t){
  if (t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t==='dark' || (t!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const b=$('#btnTheme'); if (b){ b.innerHTML = dark ? ICON_SUN : ICON_MOON; b.title = dark ? '밝게' : '어둡게'; }
}
function savePref(patch){
  let cur={}; try { cur=JSON.parse(localStorage.getItem(prefKey())||'{}'); } catch(e){}
  Object.assign(cur, patch, {at:Date.now()}); try { localStorage.setItem(prefKey(), JSON.stringify(cur)); } catch(e){}
  if (!token || !me) return;
  prefDirty=true; clearTimeout(prefSaveT); prefSaveT=setTimeout(flushPref, 800);
}
// 설정 파일에 내 pref 만 바꿔 쓴다(최신본을 다시 읽어 남의 변경을 덮지 않게). 로그아웃 전에도 한 번 불러 미처 안 쓴 것을 마저 쓴다
async function flushPref(){
  clearTimeout(prefSaveT); prefSaveT=null; if (!token || !me || !prefDirty) return;
  let cur=null; try { cur=JSON.parse(localStorage.getItem(prefKey())||'null'); } catch(e){} if (!cur){ prefDirty=false; return; }
  try { const c2=await readConfigFresh(); const u=(c2.users||[]).find(x=>x.id===me.id); if (!u) return; if (!(u.pref && (u.pref.at||0)>=(cur.at||0))){
    u.pref=Object.assign({}, u.pref||{}, cur); await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'pref: '+me.id); cfg=c2; } prefDirty=false; }
  catch(e){ console.warn('pref 저장 실패', e); }
}
function loadPref(){
  let loc={}; try { loc=JSON.parse(localStorage.getItem(prefKey())||'{}'); } catch(e){}
  const u=me && cfg && (cfg.users||[]).find(x=>x.id===me.id); const remote=(u && u.pref)||{};
  const pref=((remote.at||0) >= (loc.at||0)) ? Object.assign({}, loc, remote) : Object.assign({}, remote, loc);   // 더 나중에 바꾼 쪽이 이긴다(다른 PC 에서 바꾼 것도 따라온다)
  applyTheme(pref.theme||'');   // 밝기를 먼저 — 배율 적용이 화면 요소가 아직 없어 실패해도 밝기는 살아야 한다
  const uv = isMob() ? ('uiM' in pref ? pref.uiM : 1) : pref.ui;   // 폰은 PC 값을 따르지 않고 제 값(없으면 100%)
  if (uv){ uiScale=Math.min(1.6, Math.max(0.8, +uv||1)); try { applyUi(false); } catch(e){ document.documentElement.style.setProperty('--ui', uiScale); const r=$('#uiReset'); if (r) r.textContent=Math.round(uiScale*100)+'%'; } }
}
$('#btnTheme').addEventListener('click', ()=>{ const cur=document.documentElement.getAttribute('data-theme'); const dark = cur==='dark' || (cur!=='light' && matchMedia('(prefers-color-scheme: dark)').matches); const next = dark ? 'light' : 'dark'; applyTheme(next); savePref({theme:next}); });
applyTheme('');

$('#brand').addEventListener('click', ()=>$('#btnList').click());
$('#brand').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#btnList').click(); });
$('#btnSel').addEventListener('click', ()=>{ selMode=!selMode; lastSel=-1; if (!selMode) selIds.clear(); renderList(); });
$('#selAll').addEventListener('click', ()=>{ if (selIds.size===cases.length) selIds.clear(); else cases.forEach(c=>selIds.add(c.id)); renderList(); });
$('#selDel').addEventListener('click', async ()=>{ const ids=[...selIds]; if (!ids.length) return;
  if (!(await ask(`선택한 ${fmtN(ids.length)}건을 지웁니다. 되돌릴 수 없습니다.`,'모두 지우기'))) return; selMode=false; await deleteMany(ids); });
$('#btnPw').addEventListener('click', changePasswords);
$('#btnUsers').addEventListener('click', manageUsers);
$('#btnNew').hidden = true; $('#btnPw').hidden = true;
render();
boot();
})();
</script>
