/* 좌우 비교: 원문 | 수정본 | 메모 */

/* ── 텍스트·Word 원문 위 표시 ── */
.txtdoc{max-width:none;position:relative;line-height:1.9}

/* 편집기 */

.kbd{display:inline-block;font-family:var(--mono);font-size:.85em;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--paper-2);color:var(--ink)}
.sclist{columns:2;column-gap:28px;font-size:14px;line-height:1.9} .sclist div{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted #ddd} .sclist h4{column-span:all;margin:10px 0 4px;font-size:13px;color:#666;letter-spacing:.08em}

.txtdoc .t-rep{color:var(--rep);background:var(--rep-bg)}
.txtdoc .t-memo{background:var(--memo-bg);text-decoration:underline;text-decoration-color:var(--memo);text-decoration-thickness:1.5px;text-underline-offset:3px}
.txtdoc .hunk.hot{outline:2px solid var(--del-line)}
.txtdoc ins{color:var(--ins);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;background:var(--ins-bg);border-radius:2px;padding:0 1px}

/* 문서(특히 HTML 유형)의 자체 CSS 가 딱지를 덮어쓰지 못하게 — 글 흐름 안에서 제 자리를 차지해 글자를 가리지 않는다 */
.txtdoc .hunk+.mk,.txtdoc .mk{display:inline-block!important;position:static!important;float:none!important;width:auto!important;height:auto!important;min-width:0!important;max-width:none!important;margin:0 3px 0 2px!important;padding:2px 4px!important;line-height:1!important;font-size:calc(10.5px * var(--ui,1))!important;vertical-align:super!important;letter-spacing:0!important;word-spacing:0!important;white-space:nowrap!important;transform:none!important;box-sizing:content-box!important;text-indent:0!important;z-index:1;position:relative!important}

/* ── PDF 문서형: 쪽을 원본 그대로 그리고 그 위에 표시 ── */
.sheet.pdf{max-width:1180px;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1))}
/* 확대 시: 틀이 쪽 크기만큼 넓어지고, 화면을 넘치면 main 이 가로로 움직인다 */
.sheet.pdf.zoomed{max-width:none;width:max-content;grid-template-columns:auto calc(280px * var(--ui,1))}
.sheet.pdf .txtdoc{width:auto;max-width:none;min-width:0;background:var(--paper-3);padding:14px;border:0;box-shadow:none;border-radius:3px}
.txtdoc .tpage{background:#fff;color:#1F2430;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);padding:34px 38px;min-height:300px}
.txtdoc .tpage.hdoc{padding:0;font-family:var(--sans);font-size:16px;line-height:1.5;overflow:hidden;zoom:var(--z,1)}
/* HTML 문서는 제 CSS 를 그대로 안고 들어온다(.hbody 로 감싼 채). 글자 크기가 px 로 못박혀 있어
   글꼴 상속으로 키우는 방식(텍스트·Word 가 쓰는 --z)이 안 먹는다 → 틀째로 zoom 을 건다. */ .hbody{position:relative;min-height:200px;overflow-wrap:anywhere} .hbody img{max-width:100%;height:auto} .hbody *{max-width:100%;box-sizing:border-box} .hbody [style*="position:absolute"]{max-width:none}
.help{max-width:1000px;margin:0 auto;padding:20px 0 60px} .help section{margin:26px 0} .help h3{font-family:var(--serif);font-size:calc(17px * var(--ui,1));margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)} .help ul{margin:0;padding-left:1.3em;line-height:1.75} .help li{margin:4px 0} .help .ht{border-collapse:collapse;width:100%;font-size:calc(13.5px * var(--ui,1));line-height:1.55} .help .ht th,.help .ht td{border:1px solid var(--rule);padding:6px 9px;vertical-align:top;text-align:left} .help .ht th{background:var(--paper-2)} .help .cl{margin:0;padding:0;list-style:none} .help .cl li{padding-left:.9em;text-indent:-.9em} .help .cl li::before{content:'- ';color:var(--ink-3)} .help .hsub{font-family:var(--sans);font-size:calc(14px * var(--ui,1));margin:14px 0 6px;color:var(--ink-2)}
.hsrc{width:100%;min-height:260px;max-height:50vh;font-family:var(--mono);font-size:calc(12.5px * var(--ui,1));line-height:1.5;border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--paper-2);resize:vertical;white-space:pre;overflow:auto}
.hprev{border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;max-height:72vh;overflow-y:auto} .hprev .tpage{box-shadow:none}
.htabs{display:flex;align-items:center;gap:0;margin-bottom:8px} .htabs .hint{margin-left:12px;font-size:calc(12px * var(--ui,1));color:var(--ink-3)}
.txtdoc .tpage .pre{color:inherit}
.sheet.pdf.zoomed .pages{overflow:visible;max-width:none}
.sheet.pdf .notes-title{position:static;margin-bottom:8px}
.pages{display:flex;flex-direction:column;gap:18px;position:relative;overflow:auto;max-width:100%;background:var(--paper-3);padding:14px;border-radius:3px}
.page{position:relative;width:100%;margin:0 auto;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);overflow:hidden}
.page canvas,.page .marks{user-select:none;-webkit-user-select:none}   /* 그림·표시층은 선택 하이라이트를 안 받는다. 쪽 전체를 막으면 손잡이가 문서 끝으로 튄다 */
.page canvas{display:block;position:absolute;left:var(--cx,0px);top:var(--cy,0px);width:var(--cw,100%);height:auto}
.page .pno{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-size:calc(10px * var(--ui,1));color:#8A909B;pointer-events:none;z-index:4}
.textLayer{position:absolute;left:var(--cx,0px);top:var(--cy,0px);width:var(--cw,100%);height:var(--ch,100%);overflow:hidden;line-height:1;opacity:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}

.cropmask.l{left:0} .cropmask.r{right:0} .cropmask.t{top:0} .cropmask.b{bottom:0}

.cropline.t::after,.cropline.b::after{top:-5px;height:13px;left:50%;width:44px;margin-left:-22px}

/* 쪽은 항상 흰 종이이므로 표시 색은 고정값 */
.mbox{position:absolute;border-radius:1px}
.mbox.del,.mbox.rep{background:linear-gradient(to bottom,rgba(196,52,45,.10) 0,rgba(196,52,45,.10) calc(50% - 1px*var(--pz,1)),#C4342D calc(50% - 1px*var(--pz,1)),#C4342D calc(50% + 1px*var(--pz,1)),rgba(196,52,45,.10) calc(50% + 1px*var(--pz,1)))}
.mbox.memo{background:linear-gradient(to bottom,rgba(46,125,79,.10) 0,rgba(46,125,79,.10) calc(100% - 2px*var(--pz,1)),#2E7D4F calc(100% - 2px*var(--pz,1)))}
.mbox.hot{outline:2px solid rgba(196,52,45,.5)}
.mbox.area{background:rgba(196,52,45,.08)!important;border:2px dashed #C4342D;border-radius:3px;box-sizing:border-box}
.mbox.area.memo{background:rgba(46,125,79,.08)!important;border-color:#2E7D4F}
.mbox.rep{background:linear-gradient(to bottom,rgba(184,134,11,.13) 0,rgba(184,134,11,.13) calc(50% - 1px*var(--pz,1)),#B8860B calc(50% - 1px*var(--pz,1)),#B8860B calc(50% + 1px*var(--pz,1)),rgba(184,134,11,.13) calc(50% + 1px*var(--pz,1)))}
.mbox.area.rep{border-style:solid;background:rgba(184,134,11,.10)!important;border-color:#B8860B}
.mbox.hot.rep{outline-color:rgba(184,134,11,.55)}
body.area-mode .page{cursor:crosshair;user-select:none} body.area-mode .textLayer{pointer-events:none} body.area-mode .page canvas{-webkit-user-drag:none;user-drag:none}
.arearubber{position:absolute;border:2px dashed #C4342D;background:rgba(196,52,45,.08);pointer-events:none;z-index:5}
.marks .mk{position:absolute;pointer-events:auto;transform:translate(-40%,-90%);background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.9);z-index:4;font-size:calc(10.5px*var(--pz,1));padding:calc(2px*var(--pz,1)) calc(4px*var(--pz,1));border-radius:calc(8px*var(--pz,1));border-width:calc(1px*var(--pz,1))}
.marks .mk.memo{color:#2E7D4F;border-color:#7FC49A}
.marks .mk.rep{color:#B8860B;border-color:#E1C468} .marks .mk.rep:hover,.marks .mk.rep.hot{background:#B8860B;color:#fff}
.mk.rep{color:var(--rep);border-color:var(--rep-line)} .mk.rep:hover,.mk.rep.hot{background:var(--rep);color:#fff}
.mk.memo{color:var(--memo);border-color:#7FC49A} .mk.memo:hover,.mk.memo.hot{background:var(--memo);color:#fff}
.marks .mk.memo:hover,.marks .mk.memo.hot{background:#2E7D4F;color:#fff}
.hide-marks .marks{display:none}
.pop{position:absolute;z-index:6;display:flex;gap:4px;background:var(--btn);padding:4px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translate(-50%,8px)}
.pop button{border:0;background:transparent;color:var(--btn-ink);padding:4px 9px;border-radius:3px;cursor:pointer;font-size:calc(12.5px * var(--ui,1))}
.pop button:hover{background:rgba(127,127,127,.3)}
.pop button.d{color:#F0776E} .pop button.r{color:#F0D060} .pop button.m{color:#7FC49A}
.pop kbd{font-family:var(--mono);font-size:calc(10px * var(--ui,1));opacity:.7;margin-left:2px} .popsel{display:none}
.btn kbd{font-family:var(--mono);font-size:calc(10px * var(--ui,1));opacity:.62;margin-left:3px;font-weight:400}
.eyebrow .own,.cases li .own{color:var(--nc,var(--ink-3));font-weight:700}
.pdfmsg{padding:40px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule)}

/* 메모 목록만 보기 */
.mlist{max-width:none;margin:0;overflow-x:auto} .mlist td.kd,.mlist td.n{white-space:nowrap}
.mlist table{width:100%;border-collapse:collapse;font-size:calc(14px * var(--ui,1));min-width:640px}
.mlist th{text-align:left;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
.mlist td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
.mlist td.n{font-family:var(--mono);color:var(--del);width:34px;font-variant-numeric:tabular-nums}
.mlist .jump{font-family:var(--mono);color:var(--del);border:1px solid var(--del-line);background:transparent;border-radius:8px;padding:2px 7px;cursor:pointer;font-size:calc(12px * var(--ui,1))}
.mlist .jump:hover{background:var(--del);color:#fff}
.mlist td.w{color:var(--ink-3);white-space:nowrap;width:70px;font-variant-numeric:tabular-nums} .mlist td.who{font-weight:700;color:var(--ink)} .chip.kd{font-weight:700} .chip.kd.del{background:var(--del-bg);color:var(--del)} .chip.kd.rep{background:var(--rep-bg);color:var(--rep)} .chip.kd.memo{background:var(--memo-bg);color:var(--memo)}
.mlist td.before{font-family:var(--serif)} .mlist td.after{font-family:var(--serif);color:var(--ins)}
.mlist td.reason{color:var(--ink-2)}
.mlist .none{padding:24px 8px;color:var(--ink-3)}

/* 총평 */
.overall{max-width:1120px;margin:22px auto 0;display:grid;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1));gap:28px}
.overall .box{max-width:70ch;border-top:1px solid var(--rule);padding-top:12px}
.overall h3{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.overall textarea{width:100%;min-height:70px;border:1px solid var(--rule);background:var(--paper-2);padding:8px 10px;border-radius:3px;resize:vertical;line-height:1.5}
.overall .txt{white-space:pre-wrap;line-height:1.6}
.overall .md{min-height:44px;border:1px solid var(--rule);background:var(--paper-2);padding:8px 10px;border-radius:3px}
.overall .md:empty::before{content:attr(data-ph);color:var(--ink-3)}
.overall .txt:empty::before{content:"총평 없음";color:var(--ink-3)}

/* ── 편집 화면 ── */
.edit{max-width:1120px;margin:0 auto;padding-top:20px}
.edit h2{font-family:var(--serif);font-size:calc(22px * var(--ui,1));font-weight:600;margin:0 0 14px}
.types{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.types label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--rule);border-radius:4px;padding:10px 12px;cursor:pointer;flex:1;min-width:240px}
.types label.on{border-color:var(--ink);background:var(--paper-2)}
.types input{margin-top:3px}
.types b{display:block;font-weight:600}
.types span{font-size:calc(12px * var(--ui,1));color:var(--ink-2)}
.frow{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-bottom:14px}
.frow.lockrow{grid-template-columns:1fr 200px 1fr;align-items:end}
.frow .lockhint{font-size:calc(12px * var(--ui,1));color:var(--ink-3);padding-bottom:8px}
.frow .rm{display:flex;gap:6px;align-items:center;font-size:calc(13px * var(--ui,1));color:var(--ink-2)}
.frow label,.tcol label,.pdfpick label.l{display:block;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.frow input,.frow select{width:100%;border:1px solid var(--rule);background:var(--paper-2);padding:7px 10px;border-radius:3px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcol{min-width:0}
.tcol .lab{display:flex;align-items:baseline;gap:8px}
.tcol .lab .cnt{margin-left:auto;font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--ink-3);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.tcol textarea{width:100%;min-height:380px;border:1px solid var(--rule);background:var(--paper-2);padding:10px 12px;border-radius:3px;font-family:var(--serif);font-size:calc(14.5px * var(--ui,1));line-height:1.75;resize:vertical}
.tcol textarea.over,.pdfpick .zone.over{border-color:var(--rule-strong);background:var(--paper-3)}
.drop{margin-top:6px;font-size:calc(12px * var(--ui,1));color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop input[type=file],.pdfpick input[type=file]{display:none}
.pdfpick .zone{display:block;border:1px dashed var(--rule);border-radius:4px;padding:28px;text-align:center;color:var(--ink-2);background:var(--paper-2);cursor:pointer}
.pdfpick .zone .f{font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--ink);margin-top:8px}
.pastebox{min-height:160px;max-height:50vh;overflow:auto;border:1px solid var(--rule);border-radius:4px;padding:12px 14px;background:var(--paper-2);font-family:var(--serif);line-height:1.7;margin-bottom:10px;outline:none}
.pastebox:focus{border-color:var(--focus)}
.pastebox:empty::before{content:attr(data-ph);color:var(--ink-3);font-family:var(--sans)}
.pastebox table{border-collapse:collapse} .pastebox td,.pastebox th{border:1px solid var(--rule);padding:3px 6px}
.pastebox img,.txtdoc img{max-width:100%;height:auto;-webkit-user-drag:none;user-drag:none}
.edit .actions{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.msg{font-size:calc(13px * var(--ui,1));color:var(--ink-2)}
.msg.err{color:var(--del)}

/* ── 자체 확인창 ── */
.ask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ask .box{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ask p{margin:0 0 14px;line-height:1.55}
.ask .row{display:flex;gap:8px;justify-content:flex-end}

.ask .box h3{margin:0 0 8px;font-family:var(--serif);font-size:calc(18px * var(--ui,1))}
.ask .box input[type=password]{width:100%;border:1px solid var(--rule);background:var(--paper-2);padding:9px 10px;border-radius:3px;margin-bottom:8px;font-size:calc(15px * var(--ui,1))}
.ask .box .rm{display:flex;gap:6px;align-items:center;font-size:calc(13px * var(--ui,1));color:var(--ink-2);margin-bottom:6px}
.ask .box .l{display:block;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:6px 0 4px}
.ask .box .msg{min-height:18px;margin-bottom:8px}
.ask.lock{background:var(--paper)}

.ask .box.hist{max-width:520px}
.ask .box.hist ul{list-style:none;margin:0 0 12px;padding:0;max-height:50vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.ask .box.hist li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:calc(13px * var(--ui,1));cursor:pointer}
.ask .box.hist li:last-child{border-bottom:0}
.ask .box.hist li:hover{background:var(--paper-2)}
.ask .box.hist li.now{background:var(--paper-3);cursor:default;font-weight:600}
.ask .box.hist li.redo{color:var(--ink-3)}
.ask .box.hist li .k{font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--del);min-width:28px}
.ask .box.hist li.redo .k{color:var(--ins)}
.ask .box.hist li .t{margin-left:auto;font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--ink-3)}

/* ── 맨 위/맨 아래 동그란 버튼 ── */
.fab{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink-2);background:transparent;color:var(--ink);font-size:calc(14px * var(--ui,1));line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:2px}
.fab:hover{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.note .n .who{font-family:var(--sans);font-size:calc(11px * var(--ui,1));color:var(--ink);background:var(--paper-3);border-radius:3px;padding:0 5px}
.note .n .who.ed{color:var(--ins);background:var(--ins-bg)}
.nm{color:var(--nc,var(--ink-2));font-weight:700}
.md a.al,.txt a.al{color:var(--ins);text-decoration:underline;text-underline-offset:2px;cursor:pointer;word-break:break-all}
.nolink{color:inherit;border-bottom:1px dotted var(--ink-3);word-break:break-all}
.ins-by{background:var(--nbg,rgba(45,91,185,.14));text-decoration:underline;text-decoration-color:var(--nc,var(--ins));text-decoration-thickness:2px;text-underline-offset:3px;border-radius:2px;padding:0 2px}
.ins-by.cont::before{display:none}
.ins-by::before{content:attr(data-by);font-family:var(--sans);font-size:.72em;font-weight:700;color:var(--nc,var(--ins));margin-right:4px;vertical-align:.15em;user-select:none}
.note .n .who{color:var(--nc,var(--ink));border:1px solid var(--nc,var(--ink-3));background:transparent}
.note .n .who.ed{color:var(--nc,var(--ins));border-color:var(--nc,var(--ins));background:transparent}
.ask .box.users{max-width:640px}
.ask .box.users table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.ask .box.users th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:6px;border-bottom:1px solid var(--rule)}
.ask .box.users td{padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ask .box.users td.mono{font-family:var(--mono)}
.ask .box.users td input,.ask .box.users td select,.ask .box.users .newrow input,.ask .box.users .newrow select{border:1px solid var(--rule);background:var(--paper-2);padding:4px 6px;border-radius:3px;font-size:13px}
.ask .box.users td input{width:100%}
.ask .box.users .acts{white-space:nowrap;text-align:right}
.ask .box.users h4{margin:6px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ask .box.users .newrow{display:grid;grid-template-columns:1.2fr 1fr auto .8fr 1.2fr auto;gap:6px;align-items:center;margin-bottom:8px}
.ask .box.users input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--rule);border-radius:3px;background:transparent;cursor:pointer}
.ask .box input[type=text]{width:100%;border:1px solid var(--rule);background:var(--paper-2);padding:9px 10px;border-radius:3px;margin-bottom:8px;font-size:15px}

.visbox{margin-bottom:14px}
.visbox .lab{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.visbox .lab label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.vislist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:var(--paper-2);max-height:220px;overflow:auto;user-select:none}
.vislist label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:2px 0}
.vislist label.fixed{color:var(--ink-3)}
.vislist .mono{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:8px 14px;border-radius:4px;font-size:calc(13px * var(--ui,1));opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.prog{position:fixed;right:18px;bottom:18px;width:min(360px,calc(100vw - 36px));background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:10px 12px;z-index:40;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;font-size:calc(13px * var(--ui,1))}
.prog.show{opacity:1;transform:none} .prog .pl{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px} .prog .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .prog .pp{font-family:var(--mono);color:var(--ink-2)}
.prog .pbar{height:8px;background:var(--paper-3);border-radius:4px;overflow:hidden} .prog .pfill{height:100%;width:0;background:var(--ins);border-radius:4px;transition:width .25s}
.prog.indet .pfill{width:35%;animation:pslide 1.1s linear infinite} @keyframes pslide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* ── 반응형 ── */
@media (max-width:760px){
  .sheet,.overall,.sheet.pdf{grid-template-columns:1fr}
  .notes{position:static}
  .note{position:static;margin:6px 0}
  .notes-title{position:static;margin-top:16px}
  .frow{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;--rail-w:0px}
  .head{position:static}
  .rail{border-right:0;border-bottom:1px solid var(--rule);padding-block:10px;position:static;height:auto;overflow:visible}
  .shell.nrail{grid-template-columns:1fr}
  .shell.nrail .railbtns .fold{writing-mode:horizontal-tb;padding:6px 9px}
  .doc{padding:16px 16px;font-size:calc(15.5px * var(--ui,1))}
  main{padding-inline:16px}
}
/* ── 폰(≤760px) ─ 1단계: 가로 스크롤 없애기 · 손가락 크기 · 상단/도구줄 접기 ── */
@media (max-width:760px){
  /* 가로로 비어져 나가던 것들: 1fr 은 내용보다 못 줄어든다 → minmax(0,1fr) */
  .shell{grid-template-columns:minmax(0,1fr)}
  .sheet,.overall,.sheet.pdf{grid-template-columns:minmax(0,1fr)}
  .railrow{flex-wrap:wrap}
  main{padding-inline:12px}
  .top{padding:8px 12px;gap:8px}
  .txtdoc .tpage{padding:18px 16px}
  .doc{padding:14px 12px}
  .sheet{gap:14px}
  /* 손가락 크기(44px 기준) · iOS 는 16px 미만 입력칸에서 화면을 확대한다 */
  .top .btn,.head .tools .btn,.head .hbtns .btn{min-height:40px;padding:8px 12px}
  .seg button,.pager button,.pager input{min-height:40px}
  .fab{width:38px;height:38px}
  .cases li{padding-block:13px}
  /* 반응 피커: 손가락 크기로 */
  .reacts{gap:6px;min-height:34px} .reacts .rc{min-height:34px;padding:0 11px;font-size:calc(15px * var(--ui,1))}
  .radd .rplus{min-height:34px;padding:0 13px;font-size:calc(14px * var(--ui,1));opacity:1}
  .radd .rmenu{padding:10px 12px 12px} .radd .rmenu button{font-size:24px;padding:7px 9px}
  .radd .rmenu .rpg button{font-size:16px;padding:5px 12px}
  .rmenu .rin{width:70px;font-size:16px;padding:6px 8px} .rmenu .rtip{font-size:calc(12px * var(--ui,1))}
  .radd .rboard{gap:2px} .radd .rmenu .rboard button{font-size:23px;padding:6px 0}
  .rl{font-size:calc(13px * var(--ui,1));padding:6px 8px} .reply .rh{gap:8px}
  input,textarea,select{font-size:16px}
  /* 상단 바: 브랜드 · 새 퇴고 · ⋯ 만 남기고 접는다 */
  .top #whoami,.top .zoom,.top #btnUsers,.top #btnPw,.top #btnLock,.top #btnHelp,.top #btnList,.top #btnReload,.top #btnTheme{display:none}
  #buildAt{display:inline;font-size:calc(10.5px * var(--ui,1))}
  .top .mobonly,.tools .mobonly{display:inline-block}
  /* 문서 도구줄: 보기 전환 · 쪽 이동 · 저장 · ⋯ 만 */
  .head .tools > *{display:none}
  .head .tools > .seg,.head .tools > .pager{display:inline-flex}
  .head .tools > #docMore{display:inline-block}   /* 저장은 상단 바에 있으니 도구줄에선 뺀다 */
  .head .tools > .msg{display:inline}
  .head .hbtns button{display:none}
  .head .hint{display:none}
  .head h2{font-size:calc(21px * var(--ui,1))}
  /* 도구줄을 한 줄에: 짧은 탭 이름 · 좁은 간격 · 작은 쪽 이동 칸 */
  .seg .lg{display:none} .seg .sm{display:inline} .seg button{padding:8px 9px}
  .head .tools > .seg{margin-right:auto}   /* 탭 다음부터는 오른쪽 정렬 */
  .head .tools{gap:6px} .head .tools .btn.small{padding:8px 10px}
  .pager button{padding:0 6px;min-width:30px} .pager input{width:34px;padding:3px 0}
  /* 상단 바 둘째 줄: 새 퇴고 ┈ ↶ ↷ 저장 */
  /* 상단 바를 흐름 밖(fixed)으로 — 핀치 줌에도 원래 크기로 붙잡기 위해. 그 자리는 .shell 위쪽 여백(--top-h)으로 채워 배치는 같다 */
  .top{position:fixed;left:0;right:0;top:0}
  .shell{padding-top:var(--top-h,50px)}
  /* 안드로이드는 16px 미만 편집칸에 커서가 가면 화면을 확 확대한다 — 메모 편집칸(contenteditable)도 */
  .md[contenteditable],.fld .md,.note .md{font-size:16px!important}
  .top .brk{display:block;flex-basis:100%;height:0;margin-top:-8px}
  .top .topacts{display:inline-flex;gap:5px;margin-left:auto}
  .top .lg{display:none} .top .sm{display:inline}
  .topacts .btn.ico{padding:8px 8px;font-size:19px;font-weight:700;color:var(--ink);line-height:1}
  .topacts #tList{padding:8px 10px} .topacts #tList.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  /* 목록: 접히면 아예 안 보이고(「펼치기」 띠가 제목을 덮던 것), 문서 안에서 [목록]으로 펴면 문서 위에 덮인다 */
  #btnRail{display:none}
  body.inDoc .shell:not(.nrail) #btnRail{display:inline-flex}   /* 덮개로 열려 있을 땐 「접기」로 그냥 닫을 수 있게 */
  .shell.nrail .rail{display:none}
  body.inDoc .shell:not(.nrail) .rail{position:fixed;left:0;right:0;top:var(--top-h,50px);bottom:0;z-index:12;overflow-y:auto;background:var(--paper-2);box-shadow:0 8px 24px rgba(0,0,0,.25);padding-bottom:40px;border-bottom:0}
  /* 문서별 ⋯ 는 마우스를 올려야 나타났다 — 손가락에는 올림이 없다 */
  .cases li .more{opacity:1}
}
/* iOS 는 16px 미만 입력칸에 커서가 가면 화면을 확대한다 — 제 크기를 따로 정해 둔 칸까지 전부 */
@media (max-width:760px){
  .pager input,.rta,.rmenu .rin,.note textarea,.tcol textarea,
  .ask .box input[type=password],.ask .box input[type=text],
  .ask .box.users td input,.ask .box.users td select,.ask .box.users .newrow input,.ask .box.users .newrow select{font-size:16px}
}
/* 폰: 글자를 고르면 뜨는 삭제/바꾸기/메모 막대는 화면 아래에(iOS 의 복사/공유 메뉴는 선택 위에 뜨므로 자리 싸움을 피한다) */
@media (max-width:760px){
  .pop{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;transform:none!important;z-index:16;border-radius:12px 12px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:10px}
  .pop button{font-size:16px;padding:12px 18px;min-height:48px;border:1px solid rgba(255,255,255,.25);border-radius:8px}
  .pop kbd,.btn kbd{display:none}
  .pop{flex-wrap:wrap} .pop .popsel{display:block;width:100%;text-align:center;color:#fff;opacity:.85;font-size:14px;line-height:1.4;padding:0 6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast{z-index:60}
}
body.area-mode .page{touch-action:none}
/* 폰 메모 팝오버 */
.npop-back{display:none;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.28);touch-action:none} .npop-back.open{display:block}
.npop{display:none;position:fixed;left:8px;right:8px;z-index:15;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-height:55vh;flex-direction:column;overflow:hidden} .npop.open{display:flex}
.npop.kb{top:8px!important;bottom:auto!important;max-height:46vh}
.npop:has(.radd.open),.npop:has(.radd.open) .npop-body{overflow:visible}
.npop-head{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:calc(12px * var(--ui,1));color:var(--ink-2);flex:none}
.npop-head button{min-width:40px;min-height:36px;border:1px solid var(--rule);background:transparent;border-radius:6px;font-size:16px;color:var(--ink);cursor:pointer} .npop-head button:disabled{opacity:.3}
.npop-body{overflow-y:auto;padding:10px 12px 12px;-webkit-overflow-scrolling:touch}
.npop .note{position:static;margin:0} .npop .note .nv{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand" role="link" tabindex="0" title="홈으로"><svg class="mark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M6.5 3.5h9l5 5v14a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-18a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 3.5v5h5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 13h8M9 17h8" stroke="#8A909B" stroke-width="1.5" stroke-linecap="round"/><path d="M8 20.5c1.5-1.4 3-1.4 4.5 0s3 1.4 4.5 0" stroke="#C4342D" stroke-width="1.8" stroke-linecap="round"/></svg><h1>SN Docs <small class="beta">(Beta)<span id="buildAt" title="이 시스템이 마지막으로 업데이트된 시각"></span></small></h1></div>
  <span id="whoami" class="chip"></span>
  <span class="zoom" title="화면 글자 크기 (문서 제외)"><button id="uiMinus" aria-label="글자 작게">가−</button><button class="z" id="uiReset" title="기본으로">100%</button><button id="uiPlus" aria-label="글자 크게">가+</button></span>
  <button class="btn" id="btnUsers" hidden>사용자 관리</button>
  <button class="btn" id="btnPw" hidden>비밀번호 바꾸기</button>
  <button class="btn" id="btnLock">로그아웃</button>
  <button class="btn" id="btnHelp" title="용도·유형·복사 방향·한계">안내</button>
  <button class="btn ico" id="btnList" title="홈" aria-label="홈"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="vertical-align:-3px"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-6h4v6"/></svg></button>
  <button class="btn ico" id="btnReload" title="새로고침 (최신 판으로)" aria-label="새로고침">↻</button>
  <button class="btn ico" id="btnTheme" title="어둡게" aria-label="화면 밝기"></button>
  <button class="btn ico mobonly" id="topMore" title="더 보기" aria-label="더 보기">⋯</button><span class="brk mobonly" aria-hidden="true"></span><button class="btn primary" id="btnNew" title="새 문서를 넣거나 직접 씁니다 · Alt+N"><span class="lg">새 퇴고(새 글 작성)</span><span class="sm">새 퇴고(작성)</span></button><span class="topacts mobonly"><button class="btn" id="tList" title="문서 목록 열기/닫기">목록</button><button class="btn ico" id="tUndo" title="되돌리기" aria-label="되돌리기">↶</button><button class="btn ico" id="tRedo" title="다시 실행" aria-label="다시 실행">↷</button><button class="btn primary" id="tSave" title="저장">저장</button></span>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="railhead"><h2 id="railTitle"><span class="t">목록</span></h2><div class="railbtns"><button class="fold" id="btnRail" title="목록 접기/펼치기" aria-label="목록 접기/펼치기"><svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1.5 4.5 6 9 10.5"/><path d="M5.5 1.5 1 6l4.5 4.5"/></svg> 접기</button></div></div>
    <div class="railrow"><span class="sorts"><button class="btn small" id="sortDate" title="날짜순 · 누르면 최신↔오래된">최신순</button><button class="btn small" id="sortName" title="이름순 · 누르면 AZ↔ZA">이름 AZ</button></span><button class="btn small" id="btnSel" hidden>다수 선택</button></div>
    <div class="selbar" id="selBar" hidden><button class="btn small danger" id="selDel">선택 삭제 (0)</button><button class="btn small" id="selAll">전체</button></div>
    <ul class="cases" id="caseList"></ul>
    <div class="empty" id="caseEmpty" hidden>아직 문서가 없습니다. 「새 퇴고」로 시작하세요.</div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND = {del:'삭제', rep:'바꾸기', memo:'메모'};
const fmtN = n => (Number(n)||0).toLocaleString('ko-KR');   // 화면에 보이는 숫자는 천 단위 쉼표

let cases = [];   // docs/index.json 의 메타. 문서를 열면 복호화된 내용이 같은 객체에 합쳐진다(loaded=true)

let artifactNs = null;   // 편집자면 {} (저장 버튼 표시 플래그로만 쓴다)
let roVer = null;        // 옛 버전을 보는 중이면 그 번호(읽기 전용)
const editable = () => !!artifactNs && !roVer;
let view = {mode:'list', id:null, draft:null, dirty:false, show:'side'};
const isPdf = c => c && c.type==='pdf';
// 캡처 PDF 는 쪽 자체에 좌우 여백이 들어 있다. 원본은 그대로 두고 「얼마를 덜어내고 보여줄지」만 기억한다.
// 값은 쪽 폭·높이에 대한 비율(0~0.45). 메모 좌표·원본 PDF·주석 PDF 는 전부 원본 기준 그대로다.
function cropOf(c){
  const q=c&&c.crop; if (!q) return {l:0,r:0,t:0,b:0};
  const n=v=>Math.min(0.45, Math.max(0, +v||0));
  const o={l:n(q.l), r:n(q.r), t:n(q.t), b:n(q.b)};
  if (o.l+o.r>0.88){ o.l=0; o.r=0; }
  if (o.t+o.b>0.88){ o.t=0; o.b=0; }
  return o;
}
const hasCrop = c => { const q=cropOf(c); return q.l||q.r||q.t||q.b; };
// 쪽 위 좌표는 늘 「원본 쪽」 기준이어야 한다. 겹(.marks)이 원본 크기라 그것을 자로 쓴다.
const pgRect = el => ((el && el.querySelector && el.querySelector('.marks')) || el).getBoundingClientRect();
const isHtmlDoc = c => c && c.type==='html';          // AI 로 만든 HTML 페이지 그대로
const hasHtml = c => c && (c.type==='word' || c.type==='html');   // 본문이 HTML 인 유형

const norm = s => s.replace(/\s+/g,' ').trim();
const isText = c => c && !isPdf(c);

// ══════════════ 목록/라우팅 ══════════════
function caseCount(c){ if (!c.loaded) return c.n||0; return (c.marks||[]).length; }
function renderList(){
  const ul=$('#caseList'); ul.innerHTML=''; tmark('목록 그리기');
  $('#caseEmpty').hidden = cases.filter(canSee).length>0;
  const when = c => c.ts || c.date || '';
  const byName = (a,b)=>(a.title||'').localeCompare(b.title||'','ko');
  const byDate = (a,b)=>when(a).localeCompare(when(b)) || (a.id||'').localeCompare(b.id||'');
  const cmp = sortMode==='nameAsc' ? byName : sortMode==='nameDesc' ? (a,b)=>byName(b,a) : sortMode==='old' ? byDate : (a,b)=>byDate(b,a);
  const sd=$('#sortDate'), sn=$('#sortName');
  if (sd){ sd.textContent = sortMode==='old' ? '오래된순' : '최신순'; sd.classList.toggle('on', sortMode==='new'||sortMode==='old'); }
  if (sn){ sn.textContent = sortMode==='nameDesc' ? '이름 ZA' : '이름 AZ'; sn.classList.toggle('on', sortMode==='nameAsc'||sortMode==='nameDesc'); }
  [...cases].filter(canSee).sort(cmp).forEach(c=>{
    const li=document.createElement('li'); li.className = (view.mode==='case' && view.id===c.id) ? 'on' : ''; li.title = [c.title||'', c.owner ? '올린 사람: '+userLabel('', c.owner) : ''].filter(Boolean).join('\n'); li.dataset.id=c.id;
    if (selMode) li.classList.add('sel');
    li.innerHTML = (selMode ? `<input type="checkbox" class="ck" ${selIds.has(c.id)?'checked':''}>` : '') + (artifactNs && !selMode ? `<button class="more" title="정보 수정 · 삭제">…</button>` : '') + `<span class="t">${esc(c.title||'(제목 없음)')}</span><span class="m"><span>${esc(fmtWhen(c))}</span><span class="chip ${isPdf(c)?'pdf':''}">${isPdf(c)?'PDF':(c.type==='word'?'Word':(isHtmlDoc(c)?'HTML':'텍스트'))}</span>${(c.ver||1)>1?`<span class="chip ver" title="버전 ${c.ver}개">v${c.ver}</span>`:''}${c.lock?'<span title="문서 비밀번호 있음">🔒</span>':''}<span>${fmtN(caseCount(c))}곳</span></span>`;
    li.addEventListener('click', e=>{
      if (selMode){
        const items=[...ul.querySelectorAll('li')]; const idx=items.indexOf(li);
        if (e.shiftKey && lastSel>=0){   // Shift+클릭 = 범위 선택
          const [a,b]=[Math.min(lastSel,idx), Math.max(lastSel,idx)];
          items.slice(a,b+1).forEach(x=>{ selIds.add(x.dataset.id); x.querySelector('.ck').checked=true; });
          getSelection().removeAllRanges();
        } else { if (selIds.has(c.id)) selIds.delete(c.id); else selIds.add(c.id); li.querySelector('.ck').checked=selIds.has(c.id); }
        lastSel=idx; syncSelBar(); return; }
      openCase(c.id);
    });
    const mb=li.querySelector('.more'); if (mb) mb.addEventListener('click', e=>{ e.stopPropagation(); showItemMenu(mb, c); });
    ul.appendChild(li);
  });
  syncSelBar();
}
// ── 목록 항목 메뉴(…): 정보 수정 / 삭제 ──
function showItemMenu(btn, c){
  document.querySelectorAll('.imenu').forEach(m=>m.remove());
  const m=document.createElement('div'); m.className='imenu';
  m.innerHTML=`<button data-a="edit">정보 수정</button><button data-a="del" class="d">삭제</button>`;
  const r=btn.getBoundingClientRect(); m.style.left=(r.right-140)+'px'; m.style.top=(r.bottom+4)+'px';
  document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener('mousedown', onDown); };
  const onDown=e=>{ if (!m.contains(e.target)) close(); };
  setTimeout(()=>document.addEventListener('mousedown', onDown), 0);
  m.querySelector('[data-a="edit"]').addEventListener('click', async ()=>{ close(); await editCaseById(c.id); });
  m.querySelector('[data-a="del"]').addEventListener('click', async ()=>{ close(); if (!(await ask(`「${c.title}」 문서를 지웁니다. 되돌릴 수 없습니다.`,'지우기'))) return; await deleteMany([c.id]); });
}
async function editCaseById(id){
  if (!(await leaveOk())) return;
  const c=cases.find(x=>x.id===id); if (!c) return;
  try { if (!c.loaded) await loadDoc(c); } catch(e){ toast('열지 못했습니다: '+((e&&e.message)||e)); return; }
  view={mode:'edit', id, draft:c, dirty:false, show:'side'}; location.hash='case='+id; render();
}
// ── 다수 선택 삭제 ──
let selMode=false, lastSel=-1; const selIds=new Set();
let sortMode='new'; try { sortMode=localStorage.getItem('redpen.sort')||'new'; } catch(e){}
const setSort=m=>{ sortMode=m; try { localStorage.setItem('redpen.sort', sortMode); } catch(e){} renderList(); };
$('#sortDate').addEventListener('click', ()=>setSort(sortMode==='new' ? 'old' : 'new'));       // 이름순이었다면 최신순으로 시작
$('#sortName').addEventListener('click', ()=>setSort(sortMode==='nameAsc' ? 'nameDesc' : 'nameAsc'));
function syncSelBar(){
  const bar=$('#selBar'); if (!bar) return;
  bar.hidden=!selMode; $('#selDel').textContent=`선택 삭제 (${selIds.size})`; $('#selDel').disabled=!selIds.size;
  $('#btnSel').textContent = selMode ? '선택 끝' : '다수 선택';
}
async function deleteMany(ids){
  if (!token){ toast('편집자만 지울 수 있습니다'); return; }
  toast(`${fmtN(ids.length)}건 지우는 중…`);
  try {
    for (const id of ids){ const c=cases.find(x=>x.id===id); if (!c) continue;
      await ghDelete(`docs/${id}.json`, `delete: ${c.title}`); if (isPdf(c)) await ghDelete(`docs/${id}.pdf.enc`, `delete pdf: ${c.title}`); }
    await updateIndex(list=>{ for (const id of ids){ const i=list.findIndex(x=>x.id===id); if (i>=0) list.splice(i,1); } });
    cases=cases.filter(x=>!ids.includes(x.id)); ids.forEach(id=>selIds.delete(id));
    if (ids.includes(view.id)){ view={mode:'list',id:null,draft:null,dirty:false,show:'side'}; location.hash=''; }
    toast(`${fmtN(ids.length)}건 지웠습니다`); render();
  } catch(e){ toast('삭제 실패: '+((e&&e.message)||e)); }
}
// 저장 안 한 채 떠날 때: 저장하고 이동 / 버리기 / 취소. 편집 화면(입력 중)은 저장 대상이 없으니 버리기/취소만
async function leaveOk(){
  if (!view.dirty) return true;
  const c = view.mode==='case' ? (view.draft || cases.find(x=>x.id===view.id)) : null;
  const choice = await ask3('저장하지 않은 내용이 있습니다.', c && artifactNs ? '저장하고 이동' : null);
  if (choice==='cancel') return false;
  if (choice==='save'){ collectMarks(c); const ok=await saveDoc(c, $('#saveCase')); return !!ok; }
  return true;
}
function ask3(msg, saveLabel){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn" data-v="cancel">취소</button><button class="btn danger" data-v="discard">버리기</button>${saveLabel?`<button class="btn primary" data-v="save">${esc(saveLabel)}</button>`:''}</div></div>`;
    const done=v=>{ ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey=e=>{ if (e.key==='Escape') done('cancel'); };
    ov.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>done(b.dataset.v)));
    ov.addEventListener('mousedown', e=>{ if (e.target===ov) done('cancel'); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov); (ov.querySelector('.primary')||ov.querySelector('.danger')).focus();
  });
}
async function openCase(id){
  const target=cases.find(x=>x.id===id); if (target && !canSee(target)){ toast('이 문서는 볼 수 있는 사람으로 지정되지 않았습니다'); return; }
  if (!(await leaveOk())) return;
  view = {mode:'case', id, draft:null, dirty:false, show:'side'};
  lastNoteFocus=null; pendingSpot=null; window.scrollTo(0, 0);   // 목록에서 연 문서는 맨 위부터
  location.hash = 'case=' + id;
  render();
}
function render(){
  renderList(); requestAnimationFrame(syncTopActs);
  if (npop.h!=null) closeNotePop();
  document.body.classList.toggle('inDoc', view.mode!=='list');
  if (isMob()){ const sh=$('.shell'); if (sh){ const fold = view.mode!=='list'; if (sh.classList.contains('nrail')!==fold){ sh.classList.toggle('nrail', fold); try { syncFold(); } catch(e){} } } }   // 폰: 문서를 열면 목록을 접고, 홈이면 편다
  const main=$('#main'); main.innerHTML=''; document.body.classList.remove('zoomed-body'); document.body.style.minWidth='';
  if (view.mode==='list'){ renderHome(main); window.scrollTo(0,0); return; }
  if (view.mode==='edit'){ renderEdit(main); window.scrollTo(0,0); return; }
  if (view.mode==='help'){ renderHelp(main); window.scrollTo(0,0); return; }
  if (view.mode==='cmp'){ const c0=cases.find(x=>x.id===view.id); if (!c0 || !c0.loaded){ view.mode='case'; } else { renderCompare(main, c0); window.scrollTo(0,0); return; } }   // 문서를 내려 보다가 들어와도 위가 상단 바에 가려지지 않게
  let c = view.draft || cases.find(x=>x.id===view.id);
  if (!c){ view.mode='list'; renderHome(main); return; }
  if (!c.loaded && !view.draft){
    main.innerHTML = `<div class="head"><h2>${esc(c.title||'')}</h2><p class="msg" id="openMsg">여는 중…</p></div>`;
    (c._loading || (c._loading=loadDoc(c).finally(()=>{ c._loading=null; }))).then(()=>{ if (view.mode==='case' && view.id===c.id) render(); })
      .catch(e=>{ const om=$('#openMsg'); if (om){ om.textContent='열지 못했습니다: '+((e&&e.message)||e); om.className='msg err'; } });
    return;
  }
  roVer=null;
  if (view.ver){ const vc=versionCase(c, view.ver);
    if (!vc){ view.ver=null; }
    else if (isPdf(vc) && !vc.pdf){ main.innerHTML=`<div class="head"><h2>${esc(c.title||'')}</h2><p class="msg">${view.ver}버전 PDF 를 여는 중…</p></div>`; loadVersionPdf(c, vc).then(()=>{ if (view.ver===vc._ver) render(); }).catch(e=>{ toast('옛 버전을 열지 못했습니다: '+((e&&e.message)||e)); view.ver=null; render(); }); return; }
    else { roVer=view.ver; c=vc; } }
  main.style.setProperty('--z', isPdf(c) ? 1 : zoom.text);
  renderDocCase(main, c);
  if (!isPdf(c)){ requestAnimationFrame(fitOverall); if (pendingSpot){ const ps=pendingSpot; pendingSpot=null; restoreSpot(ps.y, !!ps.focus); } }
}

  return (c.marks||[]).map((m,i)=>({n:i+1, where: isPdf(c) ? m.page+'쪽' : '', kind:KIND[m.kind], k:m.kind, before:m.text||'', after:m.after||'', reason:withTags(m.reason||'', m.segs), who:(m.by||''), whoId:(m.byId||''), reacts:REACTS.filter(e=>(m.reacts||{})[e]&&m.reacts[e].length).map(e=>e+' '+m.reacts[e].length).join(' '), replies:(m.replies||[]).map(r=>'['+(userLabel(r.by, r.byId)||r.by||'')+'] '+(r.t||''))}));

function listHtml(items, withWhere){

  return `<div class="mlist"><table><thead><tr><th>#</th>${withWhere?'<th>위치</th>':''}<th>종류</th><th>작성</th><th>원문</th><th>바꿀 문장</th><th>이유</th></tr></thead><tbody>${items.map(it=>`

function listText(c, items){
  const head = `${c.title||''} · 퇴고 메모 ${fmtN(items.length)}곳 (${c.date||''})`;
  const plain = t => t||'';
  return head + '\n' + items.map(it=>`${it.n}. ${it.who?'['+it.who+'] ':''}${it.where?'['+it.where+'] ':''}${it.kind}${it.before?' · '+it.before:''}${it.after?'\n   → '+it.after:''}${it.reason?'\n   이유: '+plain(it.reason):''}${(it.replies||[]).map(r=>'\n   ↳ '+r).join('')}`).join('\n');

// ══════════════ 주석 PDF: 원본 PDF 에 표시를 PDF 주석으로 박는다(pdf-lib 저수준 객체) ══════════════
// 좌표: 우리 표시는 pdf.js 뷰포트 기준 0-1 비율(왼쪽 위 원점) → viewport.convertToPdfPoint 로 PDF 좌표(회전·크롭 반영)
async function exportPdfAnnots(c){
  const st=pdfState; if (!st || !st.doc) throw new Error('PDF 가 아직 열리지 않았습니다');
  if (!c.pdf) throw new Error('원본 PDF 가 없습니다');
  if (!window.PDFLib) await loadScript('vendor/pdf-lib.min.js');
  const {PDFDocument, PDFName, PDFArray, PDFHexString, PDFString}=window.PDFLib;
  const pdfDoc=await PDFDocument.load(b64ToBytes(c.pdf), {ignoreEncryption:true}); const ctx=pdfDoc.context; const pages=pdfDoc.getPages();
  let n=0;
  for (let i=0;i<c.marks.length;i++){ const m=c.marks[i]; if (!m.page || !m.rects || !m.rects.length) continue; const page=pages[m.page-1]; if (!page) continue;
    const pg=await st.doc.getPage(m.page); const vp=pg.getViewport({scale:1});
    const boxes=m.rects.map(r=>{ const pts=[[r[0],r[1]],[r[0]+r[2],r[1]],[r[0],r[1]+r[3]],[r[0]+r[2],r[1]+r[3]]].map(([x,y])=>vp.convertToPdfPoint(x*vp.width, y*vp.height));
      const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });   // 회전·크롭은 convertToPdfPoint 가 처리
    addMarkAnnot(pdfDoc, page, m, i+1, boxes, vp.width); n++;
  }
  if ((c.note||'').trim() && pages[0]){ const pg=await st.doc.getPage(1); const vp=pg.getViewport({scale:1}); const [x,y]=vp.convertToPdfPoint(12, 12); addOverallAnnot(pdfDoc, pages[0], c, x, y); }
  if (!n && !(c.note||'').trim()) throw new Error('넣을 표시가 없습니다');
  return await pdfDoc.save({useObjectStreams:false});
}
// 표시 하나 → 주석 하나(+팝업). boxes = PDF 좌표 사각형들 [x1,y1,x2,y2] (y 는 아래가 0)
const ANNOT_COL={del:[0.77,0.2,0.18], rep:[0.72,0.53,0.04], memo:[0.18,0.49,0.31]};
function pdfDateNow(){ const d=new Date(); const z=n=>String(n).padStart(2,'0'); return `D:${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
function plainMd(t){ return String(t||'').replace(/\u200B/g,'').replace(/(^|[^\w가-힣])\*([^*\n]+)\*(?=$|[^\w가-힣])/g,'$1$2').replace(/__([^_\n]+)__/g,'$1').replace(/~([^~\n]+)~/g,'$1'); }
function pushAnnot(pdfDoc, page, ref){ const {PDFName, PDFArray}=window.PDFLib; let arr=page.node.lookup(PDFName.of('Annots')); if (!(arr instanceof PDFArray)){ arr=pdfDoc.context.obj([]); page.node.set(PDFName.of('Annots'), arr); } arr.push(ref); }
function addMarkAnnot(pdfDoc, page, m, h, boxes, pageW, tag){
  const {PDFName, PDFHexString, PDFString}=window.PDFLib; const ctx=pdfDoc.context; const M=pdfDateNow();
  const quads=[]; let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for (const [x1,y1,x2,y2] of boxes){ minX=Math.min(minX,x1); minY=Math.min(minY,y1); maxX=Math.max(maxX,x2); maxY=Math.max(maxY,y2); quads.push(x1,y2, x2,y2, x1,y1, x2,y1); }
  const who=userLabel(m.by, m.byId)||m.by||''; const kind=KIND[m.kind]||m.kind;
  const body=[`[${h}] ${kind}`+(m.text?` · ${m.text}`:''), m.kind==='rep'&&m.after ? `→ ${m.after}` : '', plainMd(m.reason)].filter(Boolean).join('\n');
  const sub = m.area ? 'Square' : (m.kind==='del' ? 'StrikeOut' : 'Highlight'); const col=ANNOT_COL[m.kind]||ANNOT_COL.memo;
  const dict={Type:'Annot', Subtype:sub, Rect:[minX,minY,maxX,maxY], C:col, CA: sub==='Highlight'?0.45:1, F:4, Contents:PDFHexString.fromText(body), T:PDFHexString.fromText(who), NM:PDFString.of('redpen-'+h+(tag||'')), M:PDFString.of(M), CreationDate:PDFString.of(M), Subj:PDFHexString.fromText(kind)};
  if (sub==='Square'){ dict.BS=ctx.obj({W:1.5, S:'D', D:[4,3]}); } else { dict.QuadPoints=quads; }
  // 팝업 주석(/Popup)은 넣지 않는다 — 크롬 PDF 뷰어가 팝업 상자를 항상 그리면서 한글이 깨진 채 노출된다(2026-09-19 실측).
  // 없어도 Acrobat·Edge 는 마우스를 올리면 내용을 풍선으로 보여 주고 주석 목록에도 나온다
  const ref=ctx.register(ctx.obj(dict));
  pushAnnot(pdfDoc, page, ref);
}
function addOverallAnnot(pdfDoc, page, c, x, y){
  const {PDFHexString, PDFString}=window.PDFLib; const ctx=pdfDoc.context; const M=pdfDateNow();
  const ref=ctx.register(ctx.obj({Type:'Annot', Subtype:'Text', Rect:[x,y-20,x+20,y], Name:'Comment', C:[0.18,0.36,0.73], F:4, Contents:PDFHexString.fromText('[총평]\n'+plainMd(c.note)), T:PDFHexString.fromText(userLabel(me&&me.name, me&&me.id)||''), NM:PDFString.of('redpen-overall'), M:PDFString.of(M)}));
  pushAnnot(pdfDoc, page, ref);
}
// ══════════════ 텍스트·Word 문서의 주석 PDF: 문서를 A4 쪽으로 찍어(html2canvas) 그 위에 주석을 얹는다 ══════════════
async function exportDomPdfAnnots(c){
  if (!window.html2canvas) await loadScript('vendor/html2canvas.min.js');
  if (!window.PDFLib) await loadScript('vendor/pdf-lib.min.js');

  const W=860, PW=595.32, PH=841.92, MG=28; const sc=(PW-2*MG)/W; const pageH=(PH-2*MG)/sc;   // 쪽 안 높이(css px)
  // 1) 숨은 틀에 문서 + 표시(번호 딱지 포함)
  const host=document.createElement('div'); host.style.cssText=`position:absolute;left:0;top:0;width:${W}px;background:#fff;z-index:-5;--z:1;--ui:1`;
  const inner=document.createElement('div'); inner.className='doc txtdoc'+(c.type==='word'?' word':'')+(isHtmlDoc(c)?' html':''); inner.style.cssText='max-width:none;padding:0;background:#fff;border:0;box-shadow:none;color:#1F2430';
  inner.innerHTML=`<div class="${tpageCls(c)}" style="box-shadow:none;padding:${isHtmlDoc(c)?'0':'36px 44px'};min-height:0;background:#fff">${baseHtml(c)}</div>`; host.appendChild(inner); document.body.appendChild(host);
  try {
    c.marks.map((m,i)=>({m,h:i+1})).sort((x,y)=>y.m.start-x.m.start).forEach(({m,h})=>{ if (m.start>=0) wrapRange(inner, m.start, m.end, m.kind, h, true); });
    await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?null:new Promise(r=>{ im.onload=im.onerror=r; })));
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    const totalH=host.offsetHeight; const hr=host.getBoundingClientRect();
    // 2) 표시 좌표(css px, 틀 기준) — 줄마다 한 상자
    const marks=c.marks.map((m,i)=>{ const h=i+1; const rs=[]; host.querySelectorAll(`.hunk[data-h="${h}"]`).forEach(el=>{ [...el.getClientRects()].forEach(r=>{ if (r.width>1 && r.height>1) rs.push({x:r.left-hr.left, y:r.top-hr.top, w:r.width, h:r.height}); }); }); return {m, h, rs}; });
    // 3) 그림으로 찍기(긴 문서는 조각으로)
    const S=2, CH=2400; const chunks=[];

      const cv=await window.html2canvas(host, {scale:S, backgroundColor:'#ffffff', useCORS:true, logging:false, x:hr.left+window.scrollX, y:hr.top+window.scrollY+y, width:W, height:hgt, windowWidth:Math.max(W, document.documentElement.clientWidth), scrollX:0, scrollY:0});
      chunks.push({y, h:hgt, cv}); }
    const rowBlank=(yy)=>{ const ch=chunks.find(k=>yy>=k.y && yy<k.y+k.h); if (!ch) return true; const ctx2=ch.cv.getContext('2d'); const d=ctx2.getImageData(0, Math.min(ch.cv.height-1, Math.round((yy-ch.y)*S)), ch.cv.width, 1).data; for (let i=0;i<d.length;i+=16){ if (d[i]<235||d[i+1]<235||d[i+2]<235) return false; } return true; };
    // 4) 쪽 자르기 — 경계가 글줄 한가운데면 위쪽의 빈 줄로 물러난다
    const pagesY=[]; let y0=0; while (y0<totalH){ let y1=Math.min(y0+pageH, totalH); if (y1<totalH){ let t=y1; while (t>y0+pageH*0.6 && !rowBlank(t)) t-=2; if (t>y0+pageH*0.6) y1=t; } pagesY.push([y0,y1]); y0=y1; }

      const pc=document.createElement('canvas'); pc.width=Math.round(W*S); pc.height=Math.max(1, Math.round((b-a)*S)); const pctx=pc.getContext('2d'); pctx.fillStyle='#fff'; pctx.fillRect(0,0,pc.width,pc.height);
      for (const ch of chunks){ const top=Math.max(a, ch.y), bot=Math.min(b, ch.y+ch.h); if (bot<=top) continue; pctx.drawImage(ch.cv, 0, Math.round((top-ch.y)*S), ch.cv.width, Math.round((bot-top)*S), 0, Math.round((top-a)*S), pc.width, Math.round((bot-top)*S)); }

// ══════════════ 내보내기: 문서 + 빨간펜 표시 + 메모를 한 HTML 로 (새 탭 → 브라우저 인쇄로 PDF) ══════════════
// 앱 CSS 에서 문서·표시에 쓰는 규칙만 골라 담는다(화면 배치 규칙은 뺀다)
function exportCss(){
  const want=/^(\.doc\b|\.txtdoc|\.mk\b|\.hunk|\.page\b|\.page |\.marks|\.mbox|\.ins-by|\.chip|\.al\b|\.nolink|\.tpage|\.hbody)/;
  let out=''; try { for (const sh of document.styleSheets){ let rules; try { rules=sh.cssRules; } catch(e){ continue; } for (const r of rules){ if (r.selectorText && r.selectorText.split(',').some(x=>want.test(x.trim()))) out+=r.cssText+'\n'; } } } catch(e){}
  return out;
}

// PDF 쪽을 그림(JPEG)으로 다시 찍는다 — 화면에 아직 안 그린 쪽도 전부
async function exportPdfPages(onProg){
  const st=pdfState; if (!st || !st.doc) throw new Error('PDF 가 아직 열리지 않았습니다');
  const out=[]; const W=1400, MAXD=16000, MAXA=1.2e8;
  for (let p=1;p<=st.doc.numPages;p++){ if (onProg) onProg(p-1, st.doc.numPages);
    const page=await st.doc.getPage(p); const base=page.getViewport({scale:1}); let scale=W/base.width;
    if (base.height*scale>MAXD) scale=MAXD/base.height; if (base.width*base.height*scale*scale>MAXA) scale=Math.sqrt(MAXA/(base.width*base.height));
    const vp=page.getViewport({scale}); const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    out.push({p, w:base.width, h:base.height, src:cv.toDataURL('image/jpeg',0.85)}); cv.width=cv.height=0;
  }
  return out;
}
function exportMarks(c, p){
  return c.marks.map((m,i)=>{ if (m.page!==p) return ''; const h=i+1;
    return (m.rects||[]).map((r,ri)=>`<div class="mbox ${m.kind} hunk${m.area?' area':''}" style="left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%"></div>`

  collectMarks(c); const e=from.pop(); to.push({s:snap(c), l:e.l, t:Date.now()}); c.marks = JSON.parse(e.s);
  view.dirty=true; drawAllMarks(c); refreshPdfHead(c);
}
// 실행 기록 창: 항목을 누르면 그 시점으로 한 번에 되돌아간다(되돌리기/다시 실행을 필요한 만큼 반복)
function showHistory(c){
  if (hist.id!==c.id) hist={id:c.id, undo:[], redo:[]};
  const tm=t=>new Date(t).toTimeString().slice(0,8);
  const ov=document.createElement('div'); ov.className='ask';
  const rows=[];
  hist.redo.slice().reverse().forEach((e,i)=>rows.push(`<li class="redo" data-r="${hist.redo.length-i}"><span class="k">다시</span>${esc(e.l)}<span class="t">${tm(e.t)}</span></li>`));
  rows.push(`<li class="now"><span class="k">현재</span>지금 상태 · 표시 ${fmtN(c.marks.length)}곳</li>`);
  hist.undo.slice().reverse().forEach((e,i)=>rows.push(`<li class="undo" data-u="${i+1}"><span class="k">${i+1}</span>${esc(e.l)} 이전으로<span class="t">${tm(e.t)}</span></li>`));
  ov.innerHTML=`<div class="box hist" role="dialog" aria-modal="true"><h3>실행 기록</h3><p>되돌리기 ${fmtN(hist.undo.length)} / 다시 실행 ${fmtN(hist.redo.length)} · 문서당 ${HIST_MAX}단계까지, 새로고침하면 비워집니다. 항목을 누르면 그 시점으로 갑니다.</p>
    <ul>${rows.join('')}</ul><div class="row"><button class="btn" id="histClose">닫기</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#histClose').addEventListener('click', close);
  ov.addEventListener('mousedown', e=>{ if (e.target===ov) close(); });
  ov.querySelectorAll('li.undo').forEach(li=>li.addEventListener('click', ()=>{ const n=+li.dataset.u; for (let i=0;i<n;i++) undoMarks(c); close(); toast(`${n}단계 되돌렸습니다`); }));
  ov.querySelectorAll('li.redo').forEach(li=>li.addEventListener('click', ()=>{ const n=+li.dataset.r; for (let i=0;i<n;i++) redoMarks(c); close(); toast(`${n}단계 다시 실행했습니다`); }));
}
const undoMarks = c => applyHist(c, hist.undo, hist.redo);
const redoMarks = c => applyHist(c, hist.redo, hist.undo);

  const head = document.createElement('div'); head.className='head';

document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  const ovs=[...document.querySelectorAll('.ask:not(.lock)')]; const ov=ovs[ovs.length-1]; if (!ov) return;
  e.preventDefault(); const cancel=ov.querySelector('#pwCancel, #dpwCancel, #p2c, #uClose, #histClose, [data-v="cancel"], [data-v="0"]');
  if (cancel) cancel.click(); else ov.remove();
});
// 단축키: 입력칸 밖에서 Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y
document.addEventListener('keydown', e=>{
  if (!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if (k==='s'){ e.preventDefault(); const sb=$('#saveCase')||$('#doCompare'); if (sb && !sb.disabled && editable()){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); sb.click(); } return; }
  const tag=(e.target.tagName||'').toLowerCase();
  if (tag==='textarea'||tag==='input'||e.target.isContentEditable){
    // 메모칸에 커서가 있어도 아직 아무것도 안 적었으면(되돌릴 글자가 없으면) 표시 되돌리기로 넘긴다
    const empty = e.target.isContentEditable ? !e.target.textContent.trim() : !(e.target.value||'').trim();
    const inNote = !!e.target.closest('.note');
    if (!(inNote && empty && k==='z')) return;
    e.target.blur();
  }
  const c = view.draft || cases.find(x=>x.id===view.id); if (!c || view.mode!=='case' || !editable()) return;
  if (k==='z' && !e.shiftKey){ e.preventDefault(); undoMarks(c); }
  else if (k==='z' && e.shiftKey){ e.preventDefault(); redoMarks(c); }
});

      const last = merged[merged.length-1];
      pop=document.createElement('div'); pop.className='pop';
      pop.style.left=((last[0]+last[2]/2)*100)+'%'; pop.style.top=((last[1]+last[3])*100)+'%';
      pop.innerHTML = `<span class="popsel">${esc(text.length>80 ? text.slice(0,80)+'…' : text)}</span><button class="d" data-k="del">삭제 <kbd>Alt+1</kbd></button><button class="r" data-k="rep">바꾸기 <kbd>Alt+2</kbd></button><button class="m" data-k="memo">메모 <kbd>Alt+3</kbd></button>`;
      pop.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown', ev=>{ ev.preventDefault(); ev.stopPropagation();
        const c = cur(); pushHist(c, `${KIND[b.dataset.k]} 추가 · ${text.slice(0,18)}${text.length>18?'…':''}`);
        c.marks.push({page:+pageEl.dataset.p, rects:merged.map(r=>r.map(v=>+v.toFixed(4))), kind:b.dataset.k, text, after:'', reason:'', by: me ? me.name : '', byId: me ? me.id : '', _editing:true, _fresh:true, mid:newMid(), mt:Date.now()});
        // 쪽·위치 순으로 번호 유지
        c.marks.sort((a,b)=>a.page-b.page || a.rects[0][1]-b.rects[0][1] || a.rects[0][0]-b.rects[0][0]);
        view.dirty=true; sel.removeAllRanges(); kill();
        drawAllMarks(c); refreshPdfHead(c);
        const idx = c.marks.findIndex(m=>m.text===text && m.page===+pageEl.dataset.p && m.kind===b.dataset.k);
        setTimeout(()=>focusHunk(idx+1), 50);
      }));
      (isMob()?document.body:pageEl).appendChild(pop); pinOverlays('pop');
    }, 0);
  });
  document.addEventListener('mousedown', e=>{ if (pop && !pop.contains(e.target)) kill(); });
  // 영역 드래그: 영역 선택 모드에서 쪽 위에 네모를 그리면 같은 메뉴가 뜨고, 표시는 점선 상자로 남는다
  let rb=null, rbPage=null, rbStart=null;
  cont.addEventListener('dragstart', e=>{ if (areaMode || rbActive) e.preventDefault(); });
  cont.addEventListener('selectstart', e=>{ if (areaMode || rbActive) e.preventDefault(); });
  let rbActive=false;
  cont.addEventListener('pointerdown', e=>{
    rbActive=false; if (rb){ rb.remove(); rb=null; rbPage=null; }   // 창 밖에서 놓아 남은 끌기 상태 정리
    if (e.button!==0 || e.isPrimary===false) return;
    if (e.pointerType!=='mouse' && !areaMode) return;               // 손가락: 「영역 선택」을 켰을 때만 네모, 아니면 스크롤
    const pageEl=e.target.closest && e.target.closest('.page'); if (!pageEl) return;
    const onText = e.target.closest && e.target.closest('.textLayer'); if (!areaMode && onText) return;   // 글자 위: 글자 선택
    if (e.target.closest && e.target.closest('.pop, .mk')) return;
    rbActive=true;
    e.preventDefault(); kill(); const pr=pgRect(pageEl); rbPage=pageEl; rbStart=[(e.clientX-pr.left)/pr.width, (e.clientY-pr.top)/pr.height];
    rb=document.createElement('div'); rb.className='arearubber'; pageEl.appendChild(rb);
  });
  document.addEventListener('pointermove', e=>{
    if (!rb || !rbPage) return; const pr=pgRect(rbPage); const x=Math.min(Math.max((e.clientX-pr.left)/pr.width,0),1), y=Math.min(Math.max((e.clientY-pr.top)/pr.height,0),1);
    const l=Math.min(rbStart[0],x), t=Math.min(rbStart[1],y), w=Math.abs(x-rbStart[0]), h=Math.abs(y-rbStart[1]);
    rb.style.left=(l*100)+'%'; rb.style.top=(t*100)+'%'; rb.style.width=(w*100)+'%'; rb.style.height=(h*100)+'%'; rb._r=[l,t,w,h];
  });
  window.addEventListener('blur', ()=>{ if (rb){ rb.remove(); rb=null; rbPage=null; } rbActive=false; });
  document.addEventListener('pointercancel', ()=>{ if (rb){ rb.remove(); rb=null; rbPage=null; } rbActive=false; });   // 브라우저가 스크롤로 가져가면 네모를 거둔다
  document.addEventListener('pointerup', ()=>{
    if (!rb){ rbActive=false; return; } const r=rb._r, pageEl=rbPage; rb.remove(); rb=null; rbPage=null; setTimeout(()=>{ rbActive=false; }, 0);
    const prr=pgRect(pageEl); if (!r || r[2]*prr.width<8 || r[3]*prr.height<8) return;   // 8px 미만 네모는 무시(쪽 크기와 무관)
    const c=cur(); const rect=r.map(v=>+v.toFixed(4)); const text='[영역] '+pageEl.dataset.p+'쪽';
    pop=document.createElement('div'); pop.className='pop'; pop.style.left=((rect[0]+rect[2]/2)*100)+'%'; pop.style.top=((rect[1]+rect[3])*100)+'%';
    pop.innerHTML = `<span class="popsel">${esc(text.length>80 ? text.slice(0,80)+'…' : text)}</span><button class="d" data-k="del">삭제 <kbd>Alt+1</kbd></button><button class="r" data-k="rep">바꾸기 <kbd>Alt+2</kbd></button><button class="m" data-k="memo">메모 <kbd>Alt+3</kbd></button>`;
    pop.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown', ev=>{ ev.preventDefault(); ev.stopPropagation();
      const c=cur(); pushHist(c, `${KIND[b.dataset.k]} 영역 추가 · ${pageEl.dataset.p}쪽`);
      c.marks.push({page:+pageEl.dataset.p, rects:[rect], area:true, kind:b.dataset.k, text, after:'', reason:'', by: me ? me.name : '', byId: me ? me.id : '', mid:newMid(), mt:Date.now(), _editing:true, _fresh:true});
      c.marks.sort((a,b)=>a.page-b.page || a.rects[0][1]-b.rects[0][1] || a.rects[0][0]-b.rects[0][0]);
      view.dirty=true; kill(); drawAllMarks(c); refreshPdfHead(c);
      const idx=c.marks.findIndex(m=>m.area && m.page===+pageEl.dataset.p && m.rects[0][0]===rect[0] && m.rects[0][1]===rect[1]); setTimeout(()=>focusHunk(idx+1), 50);
    }));
    (isMob()?document.body:pageEl).appendChild(pop); pinOverlays('pop');
  });
  // 메뉴가 떠 있을 때 Alt+1/2/3 = 삭제/바꾸기/메모
  document.addEventListener('keydown', e=>{
    if (!pop || !e.altKey) return;
    const i={Digit1:0, Digit2:1, Digit3:2, Numpad1:0, Numpad2:1, Numpad3:2}[e.code]; if (i===undefined) return;
    e.preventDefault(); const b=pop.querySelectorAll('button')[i]; if (b) b.dispatchEvent(new MouseEvent('mousedown', {bubbles:true, cancelable:true}));
  });
}

// ── 창보다 넓어지면 body 를 그 폭까지 늘려, 고정 요소(상단 바·목록·머리)가 가로 스크롤에도 창 왼쪽에 붙어 있게 ──
let fbwLast=-1;
function fixBodyWidth(){
  // 몸통 폭을 지우지 않고, 문서 틀(sheet)의 실제 오른쪽 끝을 재서 필요한 폭을 정한다 → 값이 안 바뀌면 아무것도 건드리지 않는다
  const de=document.documentElement; const cw=de.clientWidth; de.style.setProperty('--vw', cw+'px');
  // 폰에서는 몸통을 넓히지 않는다 — 넓히면 목록·상단까지 같이 늘어나 가로 스크롤이 눈덩이가 된다(확대는 손가락으로)
  if (isMob()){ if (fbwLast!==0){ fbwLast=0; document.body.style.minWidth=''; document.body.classList.remove('zoomed-body'); } return; }
  const sheet=document.querySelector('.sheet'); let need=0;
  if (sheet){ const r=sheet.getBoundingClientRect(); need=Math.ceil(r.right + window.scrollX + 20); }
  const over = need > cw + 2;
  const want = over ? need : 0;
  if (want===fbwLast) return; fbwLast=want;
  document.body.style.minWidth = over ? need+'px' : ''; document.body.classList.toggle('zoomed-body', over);
}
if (window.ResizeObserver) new ResizeObserver(()=>fixBodyWidth()).observe(document.getElementById('main'));
// ── 총평 폭을 문서 폭에 맞춘다(PDF 는 쪽 틀, 텍스트는 원고 열 전체) ──
function fitOverall(){
  const box=document.querySelector('.overall .box'); if (!box) return;
  const doc=document.querySelector('.pages') || document.querySelector('.sheet .doc'); const sheet=document.querySelector('.sheet');
  if (!doc || !sheet){ box.style.width=''; return; }
  let w;
  const list=document.getElementById('mlist');
  if (sheet.hidden || (list && !list.hidden) || doc.getBoundingClientRect().width<120){ const lw=list ? list.getBoundingClientRect().width : 0; box.style.maxWidth='none'; box.style.width=(lw>200 ? Math.round(lw)+'px' : ''); return; }
  w=doc.getBoundingClientRect().width;
  box.style.maxWidth='none'; box.style.width=Math.round(w)+'px';
}
window.addEventListener('resize', ()=>{ fitOverall(); fixBodyWidth(); });

// ── 목록의 번호 → 문서의 그 자리로 ──
function jumpToHunk(h){
  const target=document.querySelector(`#doc .hunk[data-h="${h}"], .page .hunk[data-h="${h}"]`); if (!target) return false;
  const y=target.getBoundingClientRect().top + window.scrollY - headLine() - 60;
  window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
  hot(h,true); setTimeout(()=>hot(h,false), 2000);
  return true;
}
function bindJumps(root, before){
  (root||document).querySelectorAll('.mlist .jump').forEach(b=>b.addEventListener('click', ()=>{ const h=+b.dataset.n; before(); setTimeout(()=>jumpToHunk(h), 60); }));
}

// 원문 위 번호 딱지: 딱지를 우클릭하면 숨기고, 그 표시 자리(형광·줄)를 다시 우클릭하면 되살린다 — 밑의 글자를 봐야 할 때
function toggleBadge(h, show){ document.querySelectorAll(`#doc .mk[data-h="${h}"], .page .mk[data-h="${h}"]`).forEach(k=>k.classList.toggle('hid', show===undefined ? !k.classList.contains('hid') : !show)); }
document.addEventListener('contextmenu', e=>{
  const k=e.target.closest && e.target.closest('#doc .mk, .page .mk'); if (k){ e.preventDefault(); toggleBadge(k.dataset.h, false); return; }
  const hk=e.target.closest && e.target.closest('#doc .hunk'); if (hk){ e.preventDefault(); toggleBadge(hk.dataset.h); return; }
  const pg=e.target.closest && e.target.closest('.page'); const st=pdfState;
  if (pg && st && st.c){ const r=pgRect(pg); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; const p=+pg.dataset.p;
    const hit=st.c.marks.map((m,i)=>({m,h:i+1})).filter(({m})=>m.page===p && (m.rects||[]).some(rc=>x>=rc[0] && x<=rc[0]+rc[2] && y>=rc[1] && y<=rc[1]+rc[3]));
    if (hit.length){ e.preventDefault(); hit.forEach(({h})=>toggleBadge(h)); } }
});
// ── 메모 이동: 화면 위쪽 선을 기준으로 위/아래에서 가장 가까운 표시로 ──
let jumpCur=null;   // 마지막으로 다녀간 메모 번호(Alt+Q/X 한 칸씩 이동의 기준)
function jumpMemo(dir){
  const line=headLine()+6; const hunks=[...document.querySelectorAll('#doc .hunk[data-h]:not(.t-ghost), .page .hunk[data-h]:not(.ghost)')];
  const seen=new Set(); const items=[]; hunks.forEach(el=>{ const h=el.dataset.h; if (seen.has(h)) return; seen.add(h); items.push({h, top:el.getBoundingClientRect().top}); });
  if (!items.length){ toast('메모가 없습니다'); return; }
  items.sort((a,b)=>a.top-b.top);   // 문서 위치 순(번호 순이 아니라 글 순서)
  // 기준 = 커서가 들어가 있는 메모 > 마지막으로 다녀간 메모 > 지금 화면 위쪽 선 바로 아래의 메모
  let cur=null; const ae=document.activeElement; const nb=ae && ae.closest && ae.closest('.note[data-h]'); if (nb) cur=nb.dataset.h;
  if (!cur && jumpCur && items.some(x=>x.h===jumpCur)) cur=jumpCur;
  let idx=cur ? items.findIndex(x=>x.h===cur) : -1;
  let pick=null;
  if (idx>=0){ pick=items[idx+dir]; if (!pick){ toast(dir>0?'마지막 메모입니다':'첫 메모입니다'); return; } }
  else {
    if (dir>0){ const cand=items.filter(x=>x.top>line+30); pick=cand[0]; }
    else { const cand=items.filter(x=>x.top<line-30); pick=cand[cand.length-1]; }
    if (!pick){ toast(dir>0?'아래에 더 없습니다':'위에 더 없습니다'); return; }
  }
  jumpCur=pick.h;
  const y=pick.top+window.scrollY-headLine()-40; window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
  hot(pick.h,true); setTimeout(()=>hot(pick.h,false), 1800);
  const n=document.getElementById('note'+pick.h); const f=n && n.querySelector('textarea:not([hidden]), .md[contenteditable]'); if (f) setTimeout(()=>f.focus({preventScroll:true}), 350);
}

// ── 쪽 이동: 고정된 머리 아래 선을 기준으로 지금 보이는 쪽을 센다 ──
// 화면 위에 붙어 있는 것(상단 바 · 문서 머리)의 아래끝. 폰에서는 문서 머리가 sticky 가 아니라 위로 스크롤돼 사라지므로 붙어 있을 때만 센다
function headLine(){ const h=$('.head'), t=$('.top'); const tb=t ? t.getBoundingClientRect().bottom : 0; const hb=(h && getComputedStyle(h).position==='sticky') ? h.getBoundingClientRect().bottom : 0; return Math.max(tb, hb) + 6; }
function currentPage(){
  const line=headLine(); let cur=0;
  for (const el of document.querySelectorAll('.page')){ const r=el.getBoundingClientRect(); cur=+el.dataset.p; if (r.bottom > line) break; }
  return cur;
}
function goPage(n){
  // 목록만 보기 중이면 문서 위 표시로 돌아간 뒤 이동
  if (pdfListMode){ const c=view.draft||cases.find(x=>x.id===view.id); if (c){ pdfListMode=false; refreshPdfHead(c); setTimeout(()=>goPage(n), 80); } return; }
  const pages=document.querySelectorAll('.page'); if (!pages.length) return;
  n=Math.max(1, Math.min(pages.length, Math.round(n)||1));
  const el=document.querySelector(`.page[data-p="${n}"]`); if (!el) return;
  const y=el.getBoundingClientRect().top + window.scrollY - headLine();
  window.scrollTo({top:y, behavior:'smooth'});
  const pi=$('#pgIn'); if (pi) pi.value=n;
}
let pgT=null;
window.addEventListener('scroll', ()=>{ clearTimeout(pgT); pgT=setTimeout(()=>{ const pi=$('#pgIn'); if (pi && document.activeElement!==pi){ const p=currentPage(); if (p) pi.value=p; } }, 80); }, {passive:true});
document.addEventListener('keydown', e=>{
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.code==='KeyN'){ e.preventDefault(); if (!$('#btnNew').hidden) $('#btnNew').click(); return; }
  if (e.code==='KeyA'){ const ab=$('#areaBtn'); if (ab){ e.preventDefault(); ab.click(); } return; }
  if (e.code==='KeyQ' || e.code==='ArrowUp'){ e.preventDefault(); jumpMemo(-1); return; }
  if (e.code==='KeyX' || e.code==='ArrowDown'){ e.preventDefault(); jumpMemo(1); return; }
  if (!document.querySelector('.page')) return;
  if (e.code==='KeyW'){ e.preventDefault(); goPage((currentPage()||1)-1); }
  else if (e.code==='KeyS'){ e.preventDefault(); goPage((currentPage()||1)+1); }
  else if (e.code==='KeyG'){ e.preventDefault(); const pi=$('#pgIn'); if (pi){ pi.focus(); pi.select(); } }
});

function cleanPasteHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('b[style*="font-weight"]').forEach(b=>{ if (/font-weight:\s*(normal|400)/i.test(b.getAttribute('style')||'')){ const sp=doc.createElement('span'); const st=(b.getAttribute('style')||'').replace(/font-weight:\s*(normal|400);?/i,'').trim(); if (st) sp.setAttribute('style', st); while (b.firstChild) sp.appendChild(b.firstChild); b.replaceWith(sp); } });
  doc.querySelectorAll('meta, style, script, link').forEach(e=>e.remove());
  return doc.body.innerHTML;
}

async function inlineExternalImages(ed){
  const imgs=[...ed.getBody().querySelectorAll('img')].filter(i=>/^https?:\/\//i.test(i.getAttribute('src')||'') && !i.dataset.inl);
  if (!imgs.length) return; const fails=[];
  for (const im of imgs){ im.dataset.inl='1'; const url=im.getAttribute('src');
    try {
      let data=_imgInl.get(url);
      if (!data){ const r=await fetch(url, {mode:'cors', referrerPolicy:'no-referrer'}); if (!r.ok) throw new Error(r.status); const b=await r.blob(); if (!/^image\//.test(b.type)) throw new Error('not image'); data=await shrinkImage(b); _imgInl.set(url, data); }

    } catch(e){ fails.push((e&&e.message)||String(e)); console.warn('그림 받기 실패', url, e); }
  }
  if (fails.length) toast(`붙여 넣은 그림 ${fmtN(fails.length)}개를 받아오지 못했습니다 (${fails[0]}). 주소 그대로 두었습니다`);

}

async function loadTextFile(file, target, msgEl){
  msgEl.textContent = '읽는 중…';
  try {
    let text='';
    if (/\.txt$/i.test(file.name)) text = await file.text();
    else if (/\.docx$/i.test(file.name)){
      if (!window.mammoth) await loadScript('vendor/mammoth.browser.min.js');
      const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); text = r.value;
    } else throw new Error('DOCX, TXT만 읽습니다. PDF는 「PDF 문서」 유형으로 넣으세요.');
    text = text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    target.value = text; target.dispatchEvent(new Event('input'));
    msgEl.textContent = `${file.name} · ${fmtN(text.replace(/\s/g,'').length)}자`;
  } catch(e){ msgEl.textContent = '실패: ' + e.message; }
}

const admins = () => (cfg && cfg.users ? cfg.users : []).filter(u=>u.role==='admin');
// 로그인 직후: 내 열쇠쌍을 꺼내고, 없으면 만들어 설정에 적는다(저장 권한이 있을 때만). 관리자 에스크로가 빠져 있으면 채운다
async function ensureMyKeys(u, kekKey){
  myPriv=null; myPrivJwk=null;
  if (u.pub && u.pk){ try { myPrivJwk=td.decode(await decB(kekKey, ub64(u.pk))); myPriv=await importPriv(myPrivJwk); } catch(e){ myPriv=null; myPrivJwk=null; } }
  if (!token) return;
  const c2=JSON.parse(JSON.stringify(cfg)); const uu=c2.users.find(x=>x.id===u.id); if (!uu) return; let dirty=false;
  if (!myPriv){ const kp=await genKeyPair(); uu.pub=kp.pub; uu.pk=b64(await encB(kekKey, te.encode(kp.privJwk))); uu.pkA={}; myPrivJwk=kp.privJwk; myPriv=await importPriv(myPrivJwk); dirty=true; }
  uu.pkA=uu.pkA||{};
  for (const a of admins()){ if (a.pub && a.id!==u.id && !uu.pkA[a.id]){ uu.pkA[a.id]=await sealTo(a.pub, te.encode(myPrivJwk)); dirty=true; } }
  if (dirty){ await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'keys: '+u.id); cfg=c2; Object.assign(u, uu); }
}
function askPw(title){

    ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><h3>🔒 ${esc(title)}</h3><p>이 문서는 비밀번호가 따로 걸려 있습니다.</p>
      <input type="password" id="dpw" autocomplete="off" placeholder="문서 비밀번호"><div class="msg err" id="dpwErr"></div>

// 잠긴 문서의 열쇠 얻기: 편집자는 Ke 로, 뷰어는 문서 비밀번호로
async function docKey(c, d){
  if (docKeys[c.id]) return docKeys[c.id];
  if (Ke && d.wrap && d.wrap.ed){ try { const kr=await decB(Ke, ub64(d.wrap.ed)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); } catch(_){} }
  for (;;){
    const pw=await askPw(c.title||''); if (pw===null) return null;
    try { const kk=await kek(pw, d.wrap.pw.salt, cfg.iter); const kr=await decB(kk, ub64(d.wrap.pw.k)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); }
    catch(_){ toast('문서 비밀번호가 맞지 않습니다.'); }
  }
}

// ── 깃헙 읽기/쓰기. 편집자(토큰 있음)는 API 로 최신본, 뷰어는 raw CDN(몇 분 캐시) ──
const apiUrl = path => `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
const rawUrl = path => `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${path}?v=${Date.now()}`;
const authH = extra => Object.assign({Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, extra||{});
async function readBody(r, onProg){
  const total=+(r.headers.get('content-length')||0);
  if (!onProg || !r.body || !total) return new Uint8Array(await r.arrayBuffer());
  const reader=r.body.getReader(); const chunks=[]; let got=0;
  for (;;){ const {done, value}=await reader.read(); if (done) break; chunks.push(value); got+=value.length; onProg(Math.min(1, got/total)); }
  const out=new Uint8Array(got); let o=0; for (const ch of chunks){ out.set(ch, o); o+=ch.length; } return out;
}
async function ghRead(path, onProg){
  if (token){
    const r=await fetch(apiUrl(path)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH({Accept:'application/vnd.github.raw+json'}), cache:'no-store'});
    if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 읽기 실패 '+r.status); return readBody(r, onProg);
  }
  const r=await fetch(rawUrl(path), {cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('읽기 실패 '+r.status); return readBody(r, onProg);
}
async function ghSha(path){
  const cut=path.lastIndexOf('/'); const dir=cut>=0?path.slice(0,cut):''; const name=path.slice(cut+1);
  const r=await fetch(apiUrl(dir)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH(), cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 목록 실패 '+r.status);
  const arr=await r.json(); const f=(Array.isArray(arr)?arr:[]).find(x=>x.name===name); return f?f.sha:null;
}
function xhrPut(url, body, onProg){ return new Promise(res=>{ const x=new XMLHttpRequest(); x.open('PUT', url); const h=authH({'Content-Type':'application/json'}); for (const k in h) x.setRequestHeader(k, h[k]);
  x.upload.onprogress=e=>{ if (e.lengthComputable && onProg) onProg(e.loaded/e.total); }; x.onload=()=>res({ok:x.status>=200&&x.status<300, status:x.status, text:async()=>x.responseText}); x.onerror=()=>res({ok:false, status:0, text:async()=>'network error'}); x.send(body); }); }
async function ghWrite(path, u8, message, onProg){
  for (let attempt=0; attempt<2; attempt++){
    const sha=await ghSha(path);
    const body=JSON.stringify(Object.assign({message, content:b64(u8), branch:GH.branch}, sha?{sha}:{}));
    const r = (onProg && body.length>512*1024) ? await xhrPut(apiUrl(path), body, onProg) : await fetch(apiUrl(path), {method:'PUT', headers:authH({'Content-Type':'application/json'}), body});
    if (r.ok) return;
    if ((r.status===409||r.status===422) && attempt===0) continue;
    throw new Error('깃헙 쓰기 실패 '+r.status+' '+(await r.text()).slice(0,160));
  }
}
async function ghDelete(path, message){
  const sha=await ghSha(path); if (!sha) return;
  const r=await fetch(apiUrl(path), {method:'DELETE', headers:authH({'Content-Type':'application/json'}), body: JSON.stringify({message, sha, branch:GH.branch})});
  if (!r.ok && r.status!==404) throw new Error('깃헙 삭제 실패 '+r.status);
}

async function readConfigFresh(){
  // raw CDN 은 몇 분 묵은 사본을 줄 수 있다. 설정 파일만큼은 API 로(토큰 없으면 비인증 호출, 시간당 60회 제한) 읽고 안 되면 raw 로
  try {
    const r=await fetch(apiUrl('config.json')+`?ref=${GH.branch}&v=${Date.now()}`, {headers: token ? authH({Accept:'application/vnd.github.raw+json'}) : {Accept:'application/vnd.github.raw+json'}, cache:'no-store'});
    if (r.ok) return JSON.parse(td.decode(new Uint8Array(await r.arrayBuffer())));
  } catch(e){}
  const u=await ghRead('config.json'); if (!u) throw new Error('config.json 이 없습니다'); return JSON.parse(td.decode(u));
}

let esec=null;   // 편집자 봉투 안의 고정 비밀(base64). 잠긴 문서의 편집자 열쇠 Ke 는 여기서 파생
async function tryUnlock(pw){
  const key=await kek(pw, cfg.salt, cfg.iter);
  let kr=null, t=null;
  try { kr=await decB(key, ub64(cfg.editor.k)); t=td.decode(await decB(key, ub64(cfg.editor.t))); } catch(_){ kr=null; }
  if (kr){
    Kraw=kr; K=await importK(kr); token=t; role='editor';
    try { const fresh=await readConfigFresh(); if (fresh && fresh.editor) cfg=fresh; } catch(_){}
    try {
      if (cfg.editor.s){ esec=td.decode(await decB(key, ub64(cfg.editor.s))); Ke=await deriveKe(kr, esec); }
      else await migrateEditorSecret(key, kr, t);
    } catch(ex){ Ke=await deriveKe(kr, t); esec=null; setTimeout(()=>toast('편집자 열쇠 정리에 실패했습니다: '+((ex&&ex.message)||ex)+' · 잠긴 문서 기능만 영향'), 500); }
    return true;
  }
  try { const kr=await decB(key, ub64(cfg.viewer.k)); Kraw=kr; K=await importK(kr); token=null; role='viewer'; return true; } catch(_){}
  return false;
}
// 옛 구조(Ke 를 토큰에서 파생) → 새 구조(editor.s). 잠긴 문서의 편집자 봉투를 새 Ke 로 다시 싸고 config 에 s 를 넣는다
async function migrateEditorSecret(key, kr, t){
  const KeOld=await deriveKe(kr, t); const sNew=b64(crypto.getRandomValues(new Uint8Array(32))); const KeNew=await deriveKe(kr, sNew);
  const u=await ghRead('docs/index.json'); const list=u?JSON.parse(td.decode(u)):[];
  for (const m of list){ if (!m.lock) continue; const du=await ghRead(`docs/${m.id}.json`); if (!du) continue; const d=JSON.parse(td.decode(du)); if (!d.wrap||!d.wrap.ed) continue;
    try { const kd=await decB(KeOld, ub64(d.wrap.ed)); d.wrap.ed=b64(await encB(KeNew, kd)); await ghWrite(`docs/${m.id}.json`, te.encode(JSON.stringify(d)), `rekey: ${d.title}`); } catch(_){} }
  const c2=JSON.parse(JSON.stringify(cfg)); c2.editor.s=b64(await encB(key, te.encode(sNew)));
  await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'editor secret'); cfg=c2; esec=sNew; Ke=KeNew;
}

// 계정 봉투: 계정 비밀번호로 사이트 열쇠 K 를 감싸고, 편집자·관리자는 편집자 비밀 esec 도 함께
async function makeUserEnvelope(pw, role, keys){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))); const key=await kek(pw, salt, cfg.iter);
  const env={salt, k:b64(await encB(key, Kraw))};
  if (role!=='viewer') env.s=b64(await encB(key, te.encode(esec)));
  // 열쇠쌍: 이어받을 것이 있으면 그대로(비밀번호만 새로 감쌈), 없으면 새로 만든다
  let privJwk=keys&&keys.privJwk, pub=keys&&keys.pub, pkA=(keys&&keys.pkA)||{};
  if (!privJwk){ const kp=await genKeyPair(); privJwk=kp.privJwk; pub=kp.pub; pkA={}; }
  env.pub=pub; env.pk=b64(await encB(key, te.encode(privJwk))); env.pkA=Object.assign({}, pkA);
  for (const a of admins()){ if (a.pub && a.id!==(keys&&keys.id) && !env.pkA[a.id]) env.pkA[a.id]=await sealTo(a.pub, te.encode(privJwk)); }
  return env;
}
async function unlockUser(id, pw){
  const u=(cfg.users||[]).find(x=>x.id.toLowerCase()===id.trim().toLowerCase()); if (!u) return false;
  const key=await kek(pw, u.salt, cfg.iter);
  try {
    const kr=await decB(key, ub64(u.k)); Kraw=kr; K=await importK(kr); me={id:u.id, name:u.name, role:u.role};
    if (u.role!=='viewer'){ esec=td.decode(await decB(key, ub64(u.s))); Ke=await deriveKe(kr, esec); token=td.decode(await decB(Ke, ub64(cfg.tok))); role='editor'; }
    else { esec=null; Ke=null; token=null; role='viewer'; }

  } catch(_){ Kraw=null; K=null; me=null; return false; }
}
